<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Contratos · Asistente</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b3d;background:#f4f6f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);height:100dvh}.sidebar{background:#132c2c;color:#d9e7e1;padding:24px 16px;display:flex;flex-direction:column;min-height:0}.brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px}.brand-icon,.avatar{display:grid;place-items:center;background:#88dcc0;color:#113b30;border-radius:12px;font-weight:800;width:36px;height:36px}.brand strong{display:block;font-size:15px}.brand small{color:#a6c5b9;font-size:11px}.new-chat{background:#f6faf8;color:#173a32;border:0;border-radius:10px;padding:11px;font-weight:700;text-align:left}.nav-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9ab9ad;margin:25px 8px 10px}.chat-list{overflow:auto;display:grid;gap:5px;align-content:start}.chat-item{background:transparent;color:#d2e1db;border:0;border-radius:9px;padding:10px 11px;text-align:left;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.chat-item.active,.chat-item:hover{background:#244843;color:white}.side-bottom{margin-top:auto;font-size:12px;line-height:1.5;color:#a6c5b9;padding:16px 6px 0}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{background:rgba(255,255,255,.9);border-bottom:1px solid #e0e8e3;padding:15px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar h1{font-size:16px;margin:0}.topbar p{font-size:12px;color:#6b8178;margin:4px 0 0}.pill{font-size:11px;color:#12644d;background:#e6f6ee;border:1px solid #c2e9d6;border-radius:99px;padding:5px 9px;white-space:nowrap}.head-actions{display:flex;gap:7px;align-items:center}.icon-btn{border:1px solid #dae5df;background:white;color:#40594e;border-radius:8px;padding:7px 10px;font-size:12px}.stream{overflow:auto;flex:1;padding:30px 24px}.thread{max-width:850px;margin:0 auto}.welcome{padding:36px 0 16px;max-width:670px}.eyebrow{color:#287d61;font-size:11px;letter-spacing:.12em;font-weight:800;text-transform:uppercase}.welcome h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.035em;margin:8px 0}.welcome p{color:#62796d;line-height:1.6}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.suggestion{background:white;border:1px solid #d5e3dc;border-radius:10px;color:#255a49;padding:10px 12px;font-size:13px;text-align:left}.message{display:flex;gap:13px;padding:19px 0;border-top:1px solid #e3eae6}.message.user{justify-content:flex-end;border:0}.message.user .body{background:#dff1e8;border-radius:16px 16px 4px 16px;padding:12px 16px;max-width:min(78%,680px)}.message.assistant .avatar{flex:0 0 32px;height:32px;width:32px;border-radius:10px;font-size:12px}.body{min-width:0;flex:0 1 100%;line-height:1.65;overflow-wrap:anywhere}.body>:first-child{margin-top:0}.body p{margin:0 0 12px}.body h2,.body h3,.body h4{line-height:1.3;margin:20px 0 9px}.body h2{font-size:20px}.body h3{font-size:17px}.body h4{font-size:15px}.body ul,.body ol{padding-left:23px;margin:8px 0 15px}.body li{margin:5px 0}.body code{background:#e9f0ec;color:#285e4c;padding:2px 5px;border-radius:5px;font-size:.91em}.body pre{background:#18342f;color:#e5f4ed;border-radius:9px;padding:13px;overflow:auto}.body pre code{background:none;color:inherit;padding:0}.table-wrap{overflow-x:auto;margin:13px 0 18px;border:1px solid #dce7e1;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e8eeeb;vertical-align:top}th{background:#edf5f0;color:#31594a;font-weight:700}tr:last-child td{border-bottom:0}.actions{display:flex;gap:8px;align-items:center;margin-top:8px}.plain-btn{border:0;background:none;color:#648073;padding:4px 0;font-size:12px}.tools{margin-top:12px;border:1px solid #e0e9e4;border-radius:9px;background:#f9fbfa;font-size:12px}.tools summary{cursor:pointer;padding:10px 12px;color:#4a6d5b}.tool{padding:9px 12px;border-top:1px solid #e6eee9}.tool strong{font-size:12px;color:#38634f}.tool pre{font-size:11px;max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#edf3ef;color:#395247}.pending{color:#856313;background:#fff7dc;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px}.composer-area{padding:8px 24px 20px;background:linear-gradient(transparent,#f4f6f5 16%)}.composer-wrap{max-width:850px;margin:auto}.composer{display:flex;align-items:flex-end;gap:10px;background:white;border:1px solid #cbded3;border-radius:15px;padding:10px;box-shadow:0 4px 24px #173b2910}.composer textarea{border:0;outline:0;resize:none;flex:1;min-height:44px;max-height:160px;padding:10px;background:transparent;color:#20382e}.send{border:0;border-radius:10px;background:#17694e;color:white;font-weight:700;padding:12px 16px}.send:disabled{opacity:.5}.foot{display:flex;justify-content:space-between;color:#82968c;font-size:11px;padding:7px 4px 0;gap:12px}#status{color:#48836a}.mobile-new{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:14px 16px}.mobile-new{display:block}.stream{padding:20px 16px}.composer-area{padding:8px 12px 14px}.pill{display:none}.message.user .body{max-width:90%}}
</style><style>.mobile-history{display:none;max-width:125px;border:1px solid #dae5df;background:white;color:#40594e;border-radius:8px;padding:7px;font-size:12px}@media(max-width:720px){.mobile-history{display:block}.head-actions{gap:4px}.head-actions .icon-btn{padding:6px;font-size:11px}.topbar h1{font-size:14px}.topbar p{display:none}}</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-icon">C</span><span><strong>Contratos</strong><small>ASISTENTE DE REGISTRO</small></span></div><button class="new-chat" id="new">＋ &nbsp; Nueva conversación</button><div class="nav-title">Conversaciones</div><div id="chat-list" class="chat-list"></div><div class="side-bottom">Datos de prueba ficticios.<br>El historial se guarda en este navegador.</div></aside><main class="main"><header class="topbar"><div><h1>Asistente de contratos</h1><p>Recepción, validación y seguimiento</p></div><div class="head-actions"><span class="pill">GPT-5.4 · Activo</span><select id="mobile-history" class="mobile-history" aria-label="Conversaciones"></select><button class="icon-btn mobile-new" id="new-mobile">＋ Nuevo</button><button class="icon-btn" id="export">Exportar</button><button class="icon-btn" id="delete">Eliminar chat</button></div></header><div class="stream" id="stream"><div class="thread" id="thread"></div></div><div class="composer-area"><div class="composer-wrap"><div id="status" aria-live="polite"></div><form class="composer" id="form"><textarea id="input" aria-label="Escribe un mensaje" placeholder="Pregunta sobre los contratos..." rows="1" maxlength="4000" required></textarea><button class="send" id="send">Enviar ↑</button></form><div class="foot"><span>Los resultados requieren revisión humana.</span><span>Enter para enviar · Shift + Enter para nueva línea</span></div></div></div></main></div><script>
const $=s=>document.querySelector(s),storeKey='contratos.chats.v2';let chats=[];let active='';let busy=false;
try{chats=JSON.parse(localStorage.getItem(storeKey)||'[]');if(!Array.isArray(chats))chats=[]}catch{chats=[]}
if(!chats.length){try{const old=JSON.parse(sessionStorage.getItem('chatHistory')||'[]');if(old.length)chats=[{id:sessionStorage.getItem('chatId')||crypto.randomUUID(),title:'Conversación anterior',messages:old,token:sessionStorage.getItem('sessionToken')||''}]}catch{}}
function createChat(){const c={id:crypto.randomUUID(),title:'Nueva conversación',messages:[],token:''};chats.unshift(c);active=c.id;save();paint();return c}
try{active=localStorage.getItem('contratos.active')||''}catch{}if(!chats.some(c=>c.id===active))active=chats[0]?.id||'';if(!active)createChat();
function current(){return chats.find(c=>c.id===active)}function save(){try{localStorage.setItem(storeKey,JSON.stringify(chats));localStorage.setItem('contratos.active',active)}catch{$('#status').textContent='No se pudo guardar el historial en este navegador.'}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function inline(parent,text){const re=/(\*\*[^*]+\*\*|`[^`]+`)/g;let last=0;for(const m of text.matchAll(re)){parent.append(document.createTextNode(text.slice(last,m.index)));const t=m[0];parent.append(el(t.startsWith('**')?'strong':'code','',t.startsWith('**')?t.slice(2,-2):t.slice(1,-1)));last=m.index+t.length}parent.append(document.createTextNode(text.slice(last)))}
function markdown(text){const box=el('div','body');const lines=String(text||'').replace(/\r\n/g,'\n').split('\n');let i=0;while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}if(/^```/.test(line)){const block=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))block.push(lines[i++]);i++;const pre=el('pre'),code=el('code','',block.join('\n'));pre.append(code);box.append(pre);continue}const heading=line.match(/^(#{1,4})\s+(.+)/);if(heading){const h=el('h'+Math.min(4,heading[1].length+1));inline(h,heading[2]);box.append(h);i++;continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const split=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());const wrap=el('div','table-wrap'),table=el('table'),thead=el('thead'),head=el('tr');for(const cell of split(line)){const th=el('th');inline(th,cell);head.append(th)}thead.append(head);table.append(thead);i+=2;const tbody=el('tbody');while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){const tr=el('tr');for(const cell of split(lines[i])){const td=el('td');inline(td,cell);tr.append(td)}tbody.append(tr);i++}table.append(tbody);wrap.append(table);box.append(wrap);continue}if(/^\s*[-*]\s+/.test(line)){const list=el('ul');while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){const li=el('li');inline(li,lines[i].replace(/^\s*[-*]\s+/,''));list.append(li);i++}box.append(list);continue}if(/^\s*\d+[.)]\s+/.test(line)){const list=el('ol');while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){const li=el('li');inline(li,lines[i].replace(/^\s*\d+[.)]\s+/,''));list.append(li);i++}box.append(list);continue}const block=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^#{1,4}\s|^\s*[-*]\s|^\s*\d+[.)]\s|^```/.test(lines[i])&&!(lines[i].includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])))block.push(lines[i++]);const p=el('p');inline(p,block.join(' '));box.append(p)}return box}
function renderMessage(m){const row=el('article','message '+(m.cls?.startsWith('user')?'user':'assistant'));if(!m.cls?.startsWith('user'))row.append(el('span','avatar','C'));const container=el('div','content');container.append(markdown(m.text));if(m.cls?.includes('confirm'))container.append(el('div','pending','Requiere tu revisión antes de continuar.'));if(m.calls?.length){const details=el('details','tools');details.append(el('summary','',`${m.calls.length} ${m.calls.length===1?'acción consultada':'acciones consultadas'}`));for(const t of m.calls){const section=el('div','tool');section.append(el('strong','',String(t.name||'Herramienta').replace('contratos_','').replaceAll('_',' ')));const pre=el('pre','',JSON.stringify({argumentos:t.args,resultado:t.result},null,2));section.append(pre);details.append(section)}container.append(details)}if(!m.cls?.startsWith('user')){const actions=el('div','actions');const copy=el('button','plain-btn','Copiar respuesta');copy.type='button';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(m.text);copy.textContent='Copiado';setTimeout(()=>copy.textContent='Copiar respuesta',1500)}catch{copy.textContent='No se pudo copiar'}});actions.append(copy);container.append(actions)}row.append(container);return row}
function paint(){const chat=current();$('#chat-list').replaceChildren();$('#mobile-history').replaceChildren();for(const c of chats){const b=el('button','chat-item'+(c.id===active?' active':''),c.title);b.type='button';b.addEventListener('click',()=>{if(busy)return;active=c.id;save();paint()});$('#chat-list').append(b);const option=el('option','',c.title);option.value=c.id;option.selected=c.id===active;$('#mobile-history').append(option)}const thread=$('#thread');thread.replaceChildren();if(!chat.messages.length){const w=el('div','welcome');w.append(el('div','eyebrow','Registro de contratos'),el('h2','','¿Qué revisamos hoy?'),el('p','','Consulta el buzón, identifica contratos que requieren revisión y prepara un reporte de vencimientos.'));const sug=el('div','suggestions');for(const t of ['Procesa el buzón con fecha 2026-09-03','¿Qué contratos requieren revisión?','Genera las alertas al 2026-09-03']){const b=el('button','suggestion',t);b.type='button';b.addEventListener('click',()=>{$('#input').value=t;$('#input').focus()});sug.append(b)}w.append(sug);thread.append(w)}for(const m of chat.messages)thread.append(renderMessage(m));$('#stream').scrollTop=$('#stream').scrollHeight}
$('#mobile-history').addEventListener('change',e=>{if(busy){e.target.value=active;return}active=e.target.value;save();paint()});
function addMessage(chat,m){chat.messages.push(m);if(chat.title==='Nueva conversación'&&m.cls==='user')chat.title=m.text.slice(0,36)+(m.text.length>36?'…':'');save();if(chat.id===active)paint()}
$('#new').onclick=$('#new-mobile').onclick=()=>{if(!busy)createChat()};$('#delete').onclick=()=>{if(busy||!confirm('¿Eliminar esta conversación del navegador?'))return;chats=chats.filter(c=>c.id!==active);active=chats[0]?.id||'';if(!active)createChat();else{save();paint()}};$('#export').onclick=()=>{const text=current().messages.map(m=>`${m.cls==='user'?'Tú':'Asistente'}:\n${m.text}`).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=el('a');a.href=url;a.download='conversacion-contratos.txt';a.click();URL.revokeObjectURL(url)};
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}});$('#input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px'});
$('#form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const input=$('#input'),message=input.value.trim();if(!message)return;const chat=current();addMessage(chat,{text:message,cls:'user'});input.value='';input.style.height='auto';busy=true;$('#send').disabled=true;$('#status').textContent='Analizando…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId:chat.id,message,sessionToken:chat.token||undefined})});const data=await response.json();if(!response.ok)throw new Error(data.error||'No se pudo completar la consulta');if(data.sessionToken)chat.token=data.sessionToken;addMessage(chat,{text:data.reply,cls:'assistant'+(data.needsConfirmation?' confirm':''),calls:data.toolCalls||[]})}catch(error){addMessage(chat,{text:error.message,cls:'assistant confirm'})}finally{busy=false;$('#send').disabled=false;$('#status').textContent='';input.focus()}});paint();
</script></body></html>
